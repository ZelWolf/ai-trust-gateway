version: '3.8'

services:
  gateway-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sentinel-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - sentinel_data:/code/data

  soc-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: sentinel-ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - gateway-api

volumes:
  sentinel_data: